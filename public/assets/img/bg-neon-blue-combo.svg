<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.5" stop-color="#051A4D"/>
      <stop offset="1" stop-color="#020A24"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3DE8FF" stop-opacity="0.7"/>
      <stop offset="0.35" stop-color="#0A7BFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#0A7BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1F6BFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1F6BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#2FD3FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#1F6BFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6FF0FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#00D4FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.3" fill="#35D8FF" fill-opacity="0.3"/>
    </pattern>
    <linearGradient id="fadeGrid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.25"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1920" height="1080" fill="url(#fadeGrid)"/></mask>
    <radialGradient id="dotFade" cx="50%" cy="50%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </radialGradient>
    <mask id="dotMask"><rect width="1920" height="1080" fill="url(#dotFade)"/></mask>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>

  <!-- grid (v1) + dot matrix (v3) -->
  <rect width="1920" height="1080" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1920" height="1080" fill="url(#dots)" mask="url(#dotMask)"/>

  <!-- glows -->
  <ellipse cx="1480" cy="540" rx="620" ry="620" fill="url(#core)"/>
  <ellipse cx="300" cy="920" rx="640" ry="440" fill="url(#glowB)"/>
  <ellipse cx="400" cy="120" rx="460" ry="280" fill="url(#glowB)" opacity="0.55"/>

  <!-- big arcs (v3) -->
  <g fill="none" stroke="url(#arc)" filter="url(#glow)">
    <circle cx="1480" cy="540" r="230" stroke-width="3"/>
    <circle cx="1480" cy="540" r="340" stroke-width="2" opacity="0.8"/>
    <circle cx="1480" cy="540" r="470" stroke-width="1.6" opacity="0.6"/>
    <circle cx="1480" cy="540" r="620" stroke-width="1.2" opacity="0.4"/>
    <circle cx="1480" cy="540" r="800" stroke-width="1" opacity="0.25"/>
  </g>
  <circle cx="1480" cy="540" r="340" fill="none" stroke="#2FD3FF" stroke-width="16" opacity="0.14" filter="url(#soft)"/>
  <circle cx="1480" cy="540" r="400" fill="none" stroke="#7FEFFF" stroke-width="1.4" stroke-dasharray="3 12" opacity="0.5"/>

  <!-- circuit traces (v1), kept to the left and edges -->
  <g fill="none" stroke="#00D4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" opacity="0.5">
    <path d="M0 220H260L320 280H620L680 220H980"/>
    <path d="M0 330H180L240 390H460"/>
    <path d="M540 1080V930L480 870V700"/>
    <path d="M0 800H220L280 860H460"/>
    <path d="M1180 0V120L1240 180V300"/>
    <path d="M1920 960H1700L1640 1020H1480"/>
  </g>
  <g fill="#00D4FF" filter="url(#glow)">
    <circle cx="980" cy="220" r="6"/>
    <circle cx="460" cy="390" r="5"/>
    <circle cx="480" cy="700" r="5"/>
    <circle cx="460" cy="860" r="5"/>
    <circle cx="1240" cy="300" r="5"/>
    <circle cx="1480" cy="1020" r="5"/>
  </g>

  <!-- diagonal light streaks (v3) -->
  <g stroke="url(#streak)" stroke-linecap="round" filter="url(#glow)">
    <line x1="-200" y1="760" x2="900" y2="360" stroke-width="2.5" opacity="0.65"/>
    <line x1="100" y1="1000" x2="1200" y2="600" stroke-width="3" opacity="0.55"/>
    <line x1="-100" y1="860" x2="1000" y2="460" stroke-width="1.4" opacity="0.45"/>
    <line x1="400" y1="200" x2="1100" y2="-55" stroke-width="1.6" opacity="0.4"/>
  </g>

  <!-- orbit nodes -->
  <g fill="#9BF5FF" filter="url(#glow)">
    <circle cx="1880" cy="540" r="6"/>
    <circle cx="1197" cy="257" r="5"/>
    <circle cx="1763" cy="257" r="4"/>
    <circle cx="1480" cy="140" r="5"/>
  </g>

  <!-- data stream bars (v3) -->
  <g fill="#4FE3FF" opacity="0.45">
    <rect x="160" y="480" width="3" height="70" rx="1.5"/>
    <rect x="160" y="570" width="3" height="26" rx="1.5"/>
    <rect x="230" y="600" width="3" height="46" rx="1.5"/>
    <rect x="700" y="880" width="3" height="80" rx="1.5"/>
    <rect x="700" y="980" width="3" height="22" rx="1.5"/>
    <rect x="770" y="830" width="3" height="40" rx="1.5"/>
  </g>

  <!-- sparkles -->
  <g fill="#D4FAFF">
    <circle cx="210" cy="140" r="1.8" opacity="0.85"/>
    <circle cx="760" cy="90" r="1.5" opacity="0.7"/>
    <circle cx="900" cy="560" r="1.4" opacity="0.7"/>
    <circle cx="1130" cy="900" r="1.6" opacity="0.8"/>
    <circle cx="1700" cy="880" r="2" opacity="0.9"/>
    <circle cx="1820" cy="120" r="1.6" opacity="0.8"/>
    <circle cx="140" cy="680" r="1.6" opacity="0.7"/>
  </g>

  <!-- edge lines -->
  <rect y="0" width="1920" height="3" fill="#00D4FF" opacity="0.75" filter="url(#glow)"/>
  <rect y="1077" width="1920" height="3" fill="#1F6BFF" opacity="0.75" filter="url(#glow)"/>
</svg>
